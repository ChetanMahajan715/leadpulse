[project]
name = "leadpulse"
version = "1.0.0"
description = "Explainable, rule-based lead scoring with AI explanations"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "pandas>=3.1.0",
    "phonenumbers>=9.0.42",
    "plotly>=7.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
